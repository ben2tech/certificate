<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบเกียรติบัตรออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
<style>
  body{
    background: linear-gradient(160deg, #0f2b30 0%, #163b42 45%, #1f545c 100%);
    min-height:100vh;
  }
  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header.hero{
    width:100%;
    padding:64px 20px 36px;
    text-align:center;
  }
  header.hero img.logo{
    width:110px;
    height:110px;
    object-fit:contain;
    margin-bottom:22px;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));
  }
  header.hero h1{
    font-family:'Sarabun', sans-serif;
    font-weight:700;
    color:#fff;
    font-size:clamp(24px, 4.5vw, 34px);
    margin-bottom:10px;
    letter-spacing:.01em;
  }
  header.hero p{
    color:#b9d3d6;
    font-size:15px;
    margin:0;
  }
  .search-panel{
    width:100%;
    max-width:560px;
    padding:0 20px;
  }
  .search-pill{
    background:#fff;
    border-radius:999px;
    padding:6px 6px 6px 22px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }
  .search-pill svg{flex:0 0 auto;color:#7d8a9a;}
  .search-pill input{
    flex:1;
    border:none;
    padding:14px 4px;
    font-size:16px;
    background:transparent;
  }
  .search-pill input:focus-visible{outline:none;}
  .search-pill button{
    flex:0 0 auto;
    background:#2b6fb3;
    color:#fff;
    padding:13px 28px;
    border-radius:999px;
    font-weight:600;
    font-size:15px;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .15s ease;
  }
  .search-pill button:hover{background:#245c96;}
  .search-pill button:disabled{background:#8ea6bc;cursor:not-allowed;}
  #searchMsg .msg{
    background:rgba(255,255,255,.94);
  }
  .result-area{
    width:100%;
    max-width:920px;
    padding:36px 20px 80px;
  }
  .cert-frame{
    background:var(--paper);
    border-radius:10px;
    padding:16px;
    box-shadow:0 16px 40px rgba(0,0,0,.3);
  }
  .cert-frame canvas{
    width:100%;
    height:auto;
    display:block;
    border-radius:4px;
  }
  .cert-name{
    text-align:center;
    margin-top:18px;
  }
  .cert-name h2{
    font-size:24px;
    color:#fff;
  }
  .cert-actions{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  .cert-actions .btn-primary{
    background:#2b6fb3;
  }
  .cert-actions .btn-primary:hover{background:#245c96;}
  .empty-state{
    text-align:center;
    color:#b9d3d6;
    padding:30px 20px;
  }
  .cert-list-wrap{
    background:var(--paper);
    border-radius:10px;
    padding:24px;
    box-shadow:0 16px 40px rgba(0,0,0,.3);
  }
  .cert-list-title{
    font-size:17px;
    color:var(--navy);
    margin-bottom:16px;
    text-align:center;
  }
  .cert-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .cert-list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    background:#f7f3ea;
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 18px;
    font-family:'Sarabun', sans-serif;
    transition:background .15s ease, border-color .15s ease;
  }
  .cert-list-item:hover{
    background:#efe8d8;
    border-color:var(--gold);
  }
  .cert-list-name{
    font-weight:600;
    color:var(--navy);
    font-size:15px;
  }
  .cert-list-date{
    font-size:13px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  #backToListBtn{
    background:transparent;
    color:#fff;
    border:1px solid rgba(255,255,255,.55);
  }
  #backToListBtn:hover{
    background:rgba(255,255,255,.12);
    border-color:#fff;
  }
  footer{
    padding:24px 20px 44px;
    text-align:center;
    font-size:13px;
    color:#7fa1a6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <img class="logo" src="logo.png" alt="ตราโรงเรียน">
    <h1>ระบบเกียรติบัตรออนไลน์</h1>
    <p>กรอกรหัสนักเรียนเพื่อค้นหาและพิมพ์เกียรติบัตร</p>
  </header>

  <div class="search-panel">
    <form id="searchForm" class="search-pill">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <input type="text" id="codeInput" placeholder="กรอกรหัสนักเรียน เช่น 12345" autocomplete="off" inputmode="numeric">
      <button type="submit" id="searchBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        ค้นหา
      </button>
    </form>
    <div id="searchMsg"></div>
  </div>

  <div class="result-area" id="resultArea"></div>

  <footer>ระบบออกเกียรติบัตรออนไลน์ (E-Certificate Management System)</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=3"></script>
<script src="render.js?v=4"></script>
<script>
const form = document.getElementById('searchForm');
const input = document.getElementById('codeInput');
const btn = document.getElementById('searchBtn');
const msgEl = document.getElementById('searchMsg');
const resultArea = document.getElementById('resultArea');
let currentRows = [];

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = input.value.trim();
  msgEl.innerHTML = '';
  resultArea.innerHTML = '';
  if (!code) return;

  btn.disabled = true;
  const originalLabel = btn.innerHTML;
  btn.innerHTML = '<span class="spinner"></span> กำลังค้นหา';

  try {
    const { data: rows, error } = await supabaseClient
      .from('students')
      .select('*, templates(*)')
      .eq('student_code', code)
      .order('created_at', { ascending: false });

    if (error) throw error;

    if (!rows || rows.length === 0) {
      msgEl.innerHTML = `<div class="msg msg-error">ไม่พบข้อมูลรหัสนักเรียนนี้ กรุณาตรวจสอบรหัสอีกครั้ง</div>`;
      return;
    }

    const validRows = rows.filter(r => r.templates);
    if (validRows.length === 0) {
      msgEl.innerHTML = `<div class="msg msg-error">ยังไม่ได้กำหนดเกียรติบัตรสำหรับนักเรียนคนนี้</div>`;
      return;
    }

    if (validRows.length === 1) {
      currentRows = [];
      await renderResult(validRows[0]);
    } else {
      currentRows = validRows;
      renderCertList(validRows);
    }

  } catch (err) {
    console.error(err);
    msgEl.innerHTML = `<div class="msg msg-error">เกิดข้อผิดพลาดในการค้นหา ลองใหม่อีกครั้ง</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalLabel;
  }
});

function renderCertList(rows) {
  resultArea.innerHTML = `
    <div class="cert-list-wrap">
      <h2 class="cert-list-title">พบเกียรติบัตร ${rows.length} ใบ — เลือกใบที่ต้องการดู</h2>
      <div class="cert-list" id="certList"></div>
    </div>
  `;
  const listEl = document.getElementById('certList');
  rows.forEach((row, idx) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'cert-list-item';
    const dateStr = row.created_at ? new Date(row.created_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
    item.innerHTML = `
      <span class="cert-list-name">${escapeHtml(row.templates.name)}</span>
      <span class="cert-list-date">${escapeHtml(dateStr)}</span>
    `;
    item.addEventListener('click', () => renderResult(row));
    listEl.appendChild(item);
  });
}

async function renderResult(student) {
  const backBtnHtml = currentRows.length > 1 ? `<button class="btn-secondary" id="backToListBtn" style="margin-bottom:18px;">‹ กลับไปดูใบอื่น</button>` : '';
  resultArea.innerHTML = `
    ${backBtnHtml}
    <div class="cert-frame">
      <canvas id="certCanvas"></canvas>
    </div>
    <div class="cert-name">
      <h2>${escapeHtml(student.name)}</h2>
    </div>
    <div class="cert-actions">
      <button class="btn-primary" id="downloadBtn">ดาวน์โหลดเกียรติบัตร</button>
    </div>
  `;

  if (currentRows.length > 1) {
    document.getElementById('backToListBtn').addEventListener('click', () => renderCertList(currentRows));
  }

  const img = await loadImage(student.templates.background_url);
  const canvas = document.getElementById('certCanvas');
  await drawCertificate(canvas, img, student.templates.fields, student);

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `เกียรติบัตร-${student.student_code}-${student.templates.name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
